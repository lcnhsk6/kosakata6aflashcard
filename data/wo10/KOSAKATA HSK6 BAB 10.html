        // ============================================================
        //  STATE
        // ============================================================
        let currentData = [...baseData];
        let currentIndex = 0;
        const total = baseData.length;

        // DOM refs
        const cardFlipper = document.getElementById('cardFlipper');
        const cardWrapper = document.getElementById('cardWrapper');
        const hanziDisplay = document.getElementById('hanziDisplay');
        const frontIndex = document.getElementById('frontIndex');
        const pinyinDisplay = document.getElementById('pinyinDisplay');
        const artiDisplay = document.getElementById('artiDisplay');
        const contohHanzi = document.getElementById('contohHanzi');
        const contohPinyin = document.getElementById('contohPinyin');
        const contohArti = document.getElementById('contohArti');
        const navCounter = document.getElementById('navCounter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');

        let isFlipped = false;

        // ============================================================
        //  RENDER
        // ============================================================
        function renderCard(index) {
            const data = currentData[index];
            if (!data) return;

            hanziDisplay.textContent = data.hanzi;
            frontIndex.textContent = `${index + 1} / ${total}`;

            pinyinDisplay.textContent = data.pinyin;
            artiDisplay.textContent = data.arti;

            // Highlight target
            const target = data.hanzi;
            let contohHtml = data.contoh;
            if (target.length === 1) {
                const regex = new RegExp(target, 'g');
                contohHtml = contohHtml.replace(regex, `<span class="highlight-word">${target}</span>`);
            } else {
                const regex = new RegExp(target, 'g');
                contohHtml = contohHtml.replace(regex, `<span class="highlight-word">${target}</span>`);
            }
            contohHanzi.innerHTML = contohHtml;

            contohPinyin.textContent = data.contohPinyin;
            contohArti.textContent = data.contohArti;

            navCounter.textContent = `${index + 1} / ${total}`;
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === total - 1);

            if (isFlipped) {
                cardFlipper.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function goTo(index) {
            if (index < 0 || index >= total) return;
            currentIndex = index;
            renderCard(currentIndex);
        }

        function nextCard() {
            if (currentIndex < total - 1) goTo(currentIndex + 1);
        }

        function prevCard() {
            if (currentIndex > 0) goTo(currentIndex - 1);
        }

        // ============================================================
        //  SHUFFLE
        // ============================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleCards() {
            shuffleArray(currentData);
            currentIndex = 0;
            renderCard(0);
        }

        // ============================================================
        //  FLIP
        // ============================================================
        function toggleFlip(e) {
            if (e.target.closest('.nav-btn') || e.target.closest('.nav-bar')) return;
            cardFlipper.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        // ============================================================
        //  KEYBOARD
        // ============================================================
        function handleKeydown(e) {
            if (e.key === 'ArrowRight') { e.preventDefault();
                nextCard(); }
            if (e.key === 'ArrowLeft') { e.preventDefault();
                prevCard(); }
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault();
                toggleFlip(e); }
        }

        // ============================================================
        //  INIT
        // ============================================================
        cardWrapper.addEventListener('click', toggleFlip);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation();
            prevCard(); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation();
            nextCard(); });
        randomBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            shuffleCards();
        });
        document.addEventListener('keydown', handleKeydown);

        renderCard(0);

        // ============================================================
        //  SWIPE
        // ============================================================
        let touchStartX = 0;
        let touchStartY = 0;
        const wrapper = document.querySelector('.phone-frame');

        wrapper.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: true });

        wrapper.addEventListener('touchend', (e) => {
            if (touchStartX === 0) return;
            const touchEnd = e.changedTouches[0];
            const deltaX = touchEnd.clientX - touchStartX;
            const deltaY = touchEnd.clientY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                if (deltaX < 0) nextCard();
                else prevCard();
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        console.log(`✅ HSK6 LESSON 10 — ${total} kosakata siap!`);
